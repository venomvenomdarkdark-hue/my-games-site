<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>فينوم 6</title>
<style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial,Tahoma,sans-serif;overflow:hidden}
canvas#c{display:block;width:100%;height:100%}
#hud{position:fixed;top:8px;left:10px;pointer-events:none;text-shadow:0 2px 4px #000;font-size:15px;max-width:44vw}
#mo{font-size:20px;font-weight:bold;color:#fde047}
#ms{margin-top:4px;color:#bfe9ff;font-size:13px;line-height:1.4}
#mm{position:fixed;top:8px;right:10px;width:96px;height:96px;border-radius:50%;border:2px solid #1d4f73;pointer-events:none;box-shadow:0 0 14px #38bdf855}
.tb{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:6}
.tb button{font-size:13px;padding:6px 12px;min-width:0;border-radius:18px;box-shadow:none;background:#0b1e2e;border:1px solid #1d4f73;color:#bfe9ff}
#ab{position:fixed;right:16px;bottom:14px;display:flex;gap:10px;z-index:6}
#ab button{width:72px;height:72px;border-radius:50%;font-size:14px;padding:0;min-width:0;line-height:1.2}
#bN{background:#b45309;border-color:#fbbf24;box-shadow:0 0 16px #f59e0b88}
#bH{background:#334155;border-color:#94a3b8;box-shadow:none}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:bold;color:#fde047;text-shadow:0 0 12px #000;opacity:0;transition:opacity .3s;pointer-events:none;z-index:7;text-align:center}
#ov{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,rgba(8,40,70,.95),rgba(0,0,0,.98));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;z-index:10}
#ov.hide{display:none}
#ov h2{margin:0;font-size:28px;text-shadow:0 0 10px #38bdf8,0 0 30px #38bdf8}
#ov:not(.hide)::before{content:'\26A1';font-size:36px;color:#38bdf8;text-shadow:0 0 22px #38bdf8}
#ov p{margin:0;color:#9db8cf;font-size:15px;max-width:560px;line-height:1.6}
#ob{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:640px}
button{font-size:17px;padding:10px 22px;border-radius:14px;background:#0284c7;color:#fff;font-weight:bold;min-width:150px;box-shadow:0 0 18px #38bdf8aa;border:1px solid #38bdf8;font-family:inherit}
button:disabled{opacity:.4}
a{color:#94a3b8;font-size:14px}
#jb,#jk{position:fixed;border-radius:50%;pointer-events:none;display:none;z-index:5}
#jb{width:110px;height:110px;margin:-55px 0 0 -55px;border:2px solid #38bdf866;background:#38bdf814}
#jk{width:46px;height:46px;margin:-23px 0 0 -23px;background:#38bdf8aa;box-shadow:0 0 16px #38bdf8}
#rot{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:20px;color:#bfe9ff}
#rot b{font-size:60px;color:#38bdf8}
@media (orientation:portrait){#rot{display:flex}}
@media (max-height:420px){#ov h2{font-size:22px}#ov:not(.hide)::before{font-size:26px}#ov p{font-size:13px}button{padding:8px 16px;font-size:15px}#ab button{width:62px;height:62px;font-size:12px}}

<body>
<canvas id="c"></canvas>
<div id="hud"><div id="mo">0 جنيه</div><div id="ms"></div></div>
<canvas id="mm" width="96" height="96"></canvas>
<div class="tb"><button id="mt">كتم الصوت</button><button id="sh">المتجر</button></div>
<div id="ab"><button id="bN">نيترو</button><button id="bH">بوق</button><button id="bE">ركوب</button></div>
<div id="toast"></div>
<div id="jb"></div><div id="jk"></div>
<div id="ov"><h2 id="oh">فينوم 6</h2><p id="op"></p><div id="ob"><button id="go">ابدأ</button></div><a href="index.html">الرجوع للرئيسية</a></div>
<div id="rot"><b>&#8635;</b>لف الموبايل بالعرض عشان تلعب</div>
<script>
const P=620,R=150,B=P-R,SW=16,DAY=240;
const mod=(a,m)=>((a%m)+m)%m,hh=(a,b)=>(Math.imul(a|0,73856093)^Math.imul(b|0,19349663))>>>0;
const ad=a=>mod(a+Math.PI,Math.PI*2)-Math.PI;
const $=id=>document.getElementById(id);
function lcg(s){return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
// ---------- audio ----------
let ac=null,master=null,eo=null,eg=null,muted=false;
function ens(){if(ac)return true;try{
 ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
 eo=ac.createOscillator();eg=ac.createGain();const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
 eo.type='sawtooth';eo.frequency.value=50;eg.gain.value=0;eo.connect(f);f.connect(eg);eg.connect(master);eo.start();return true}catch(e){ac=null;return false}}
function snd(fq,d,ty,v,sl){if(!ens())return;try{if(ac.state==='suspended')ac.resume();
 const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(fq,n);
 if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,sl),n+d);
 g.gain.setValueAtTime(v||.1,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(master);o.start();o.stop(n+d)}catch(e){}}
function nz(d,v,fc){if(!ens())return;try{const n=ac.currentTime,b=ac.createBuffer(1,Math.floor(ac.sampleRate*d),ac.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
 const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=fc;
 const g=ac.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(master);s.start(n)}catch(e){}}
// ---------- canvas ----------
const cv=$('c'),cx=cv.getContext('2d'),mmc=$('mm').getContext('2d');
let W,H,D,Z,VW,VH,dq=1.5;
function rs(){D=Math.min(window.devicePixelRatio||1,dq);W=innerWidth;H=innerHeight;Z=H/400;VW=W/Z;VH=400;cv.width=W*D;cv.height=H*D}
rs();addEventListener('resize',rs);
// ---------- save ----------
let S={money:0,eng:0,nit:0,tire:0,col:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('vcity')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('vcity',JSON.stringify(S))}catch(e){}}
const COLS=['#e11d48','#2563eb','#16a34a','#f59e0b','#a855f7','#e5e7eb'];
const LOT=['#5b6b7d','#6d5b5b','#5b6d62','#756a55','#55627a','#6a5578','#4f6a70','#7a6150'];
// ---------- world ----------
const isPark=(ci,cj)=>hh(ci,cj)%6===0;
function solid(x,y){const lx=mod(x,P),ly=mod(y,P);if(lx<R||ly<R)return false;const bx=lx-R,by=ly-R;
 if(bx<SW||bx>B-SW||by<SW||by>B-SW)return false;return !isPark(Math.floor(x/P),Math.floor(y/P))}
const hit=(x,y,r)=>solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r);
// ---------- state ----------
let pc,me,inCar,tcs,coins,peds,m,time,dayT,shake,nitT,nitCd,paused=true,started=false,last=0,vx=0,vy=0,hornT=0,frame=0,saveT=0,fpsA=.016,fpsT=0;
function init(){
 pc={x:R/2+30,y:300,h:Math.PI/2,v:0};me={x:R/2-34,y:320,h:0,w:0};inCar=false;tcs=[];coins=[];peds=[];
 time=0;dayT=DAY*.42;shake=0;nitT=0;nitCd=0;m=null;newMission(true);
 for(let i=0;i<10;i++){spawnT(true);spawnC(true);spawnP(true)}
}
const ent=()=>inCar?pc:me;
// ---------- missions ----------
function roadPoint(e,dmin,dmax){
 for(let k=0;k<30;k++){const a=Math.random()*7,d=dmin+Math.random()*(dmax-dmin);const x=e.x+Math.cos(a)*d,y=e.y+Math.sin(a)*d;
  if(Math.random()<.5)return{x:Math.floor(x/P)*P+R/2,y};else return{x,y:Math.floor(y/P)*P+R/2}}
 return{x:e.x+500,y:e.y}}
function newMission(first){
 const e=ent(),pt=roadPoint(e,first?350:500,first?700:1500),d=Math.hypot(pt.x-e.x,pt.y-e.y);
 m={st:0,x:pt.x,y:pt.y,t:d/55+35}}
function missionUpdate(dt){
 m.t-=dt;const e=ent(),d=Math.hypot(m.x-e.x,m.y-e.y);
 if(m.t<=0){toast('انتهى الوقت! مشوار جديد');newMission();return}
 if(d<56){
  if(m.st===0){const pt=roadPoint(m,700,1900),dd=Math.hypot(pt.x-m.x,pt.y-m.y);m={st:1,x:pt.x,y:pt.y,t:dd/55+30,len:dd};toast('استلمت الطلب! وصّله');snd(880,.12,'sine',.1);setTimeout(()=>snd(1175,.15,'sine',.1),110)}
  else{const rw=Math.round(30+m.len/8);S.money+=rw;save();toast('وصّلت الطلب! +'+rw+' جنيه');snd(523,.12,'sine',.1);setTimeout(()=>snd(659,.12,'sine',.1),110);setTimeout(()=>snd(784,.2,'sine',.1),220);newMission()}
 }}
let toastT=0;function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,1800)}
// ---------- spawning ----------
const far=()=>Math.hypot(VW,VH)/2+80;
const TC=['#ef4444','#3b82f6','#e5e7eb','#facc15','#22c55e','#f97316','#94a3b8','#14b8a6'];
function spawnT(any){if(tcs.length>=14)return;const e=ent(),ax=Math.random()<.5,dir=Math.random()<.5?1:-1,fr=any?200:far(),off=(any?100:0)+fr+Math.random()*350,sg=Math.random()<.5?-1:1;
 let x,y,h;
 if(ax){const ci=Math.floor(e.x/P)+((Math.random()*3)|0)-1;x=ci*P+R/2+(dir>0?-30:30);y=e.y+sg*off;h=dir>0?Math.PI/2:-Math.PI/2}
 else{const cj=Math.floor(e.y/P)+((Math.random()*3)|0)-1;y=cj*P+R/2+(dir>0?30:-30);x=e.x+sg*off;h=dir>0?0:Math.PI}
 const k=Math.random()<.2?1:0;tcs.push({x,y,h,v:0,sp:80+Math.random()*60,col:TC[(Math.random()*TC.length)|0],l:k?66:54,w:k?31:28,k})}
function spawnC(any){if(coins.length>=16)return;const e=ent(),fr=any?120:far()*.7,sg=Math.random()<.5?-1:1,o=fr+Math.random()*500;
 if(Math.random()<.5){const ci=Math.floor(e.x/P)+((Math.random()*3)|0)-1;coins.push({x:ci*P+R/2+(Math.random()-.5)*60,y:e.y+sg*o})}
 else{const cj=Math.floor(e.y/P)+((Math.random()*3)|0)-1;coins.push({x:e.x+sg*o,y:cj*P+R/2+(Math.random()-.5)*60})}}
function spawnP(any){if(peds.length>=18)return;const e=ent(),ci=Math.floor(e.x/P)+((Math.random()*3)|0)-1,cj=Math.floor(e.y/P)+((Math.random()*3)|0)-1;
 const bx=ci*P+R,by=cj*P+R,sd=(Math.random()*4)|0,t0=Math.random()*B;let x,y,dx=0,dy=0;
 if(sd===0){x=bx+t0;y=by+SW/2;dx=1}else if(sd===1){x=bx+t0;y=by+B-SW/2;dx=1}else if(sd===2){x=bx+SW/2;y=by+t0;dy=1}else{x=bx+B-SW/2;y=by+t0;dy=1}
 if(!any&&Math.abs(x-e.x)<VW/2+30&&Math.abs(y-e.y)<VH/2+30)return;
 peds.push({x,y,dx,dy,sp:22+Math.random()*14,dir:Math.random()<.5?1:-1,col:['#f87171','#60a5fa','#facc15','#a3e635','#f0abfc','#fb923c'][(Math.random()*6)|0],bx,by,tt:2+Math.random()*4})}
// ---------- controls ----------
let st=null;const jb=$('jb'),jk=$('jk');
function jshow(x,y,kx,ky){jb.style.display=jk.style.display='block';jb.style.left=x+'px';jb.style.top=y+'px';jk.style.left=kx+'px';jk.style.top=ky+'px'}
const jend=()=>{st=null;vx=vy=0;jb.style.display=jk.style.display='none'};
cv.addEventListener('pointerdown',e=>{if(st)return;st={id:e.pointerId,x:e.clientX,y:e.clientY};vx=vy=0;jshow(e.clientX,e.clientY,e.clientX,e.clientY)});
cv.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.id)return;const dx=e.clientX-st.x,dy=e.clientY-st.y,mm=Math.hypot(dx,dy);
 if(mm>0){const k=Math.min(mm,55)/55;vx=dx/mm*k;vy=dy/mm*k;const c=Math.min(mm,55);jshow(st.x,st.y,st.x+dx/mm*c,st.y+dy/mm*c)}});
cv.addEventListener('pointerup',e=>{if(st&&e.pointerId===st.id)jend()});cv.addEventListener('pointercancel',e=>{if(st&&e.pointerId===st.id)jend()});
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key==='e')toggleCar();if(e.key==='n')nitro();if(e.key==='h')horn()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function toggleCar(){if(paused)return;
 if(inCar){let ok=false;for(const s of[1,-1]){const nx=pc.x+Math.cos(pc.h+Math.PI/2*s)*34,ny=pc.y+Math.sin(pc.h+Math.PI/2*s)*34;if(!hit(nx,ny,7)){me.x=nx;me.y=ny;ok=true;break}}
  if(!ok){me.x=pc.x;me.y=pc.y}inCar=false;pc.v=0;snd(300,.1,'square',.06,200)}
 else if(Math.hypot(pc.x-me.x,pc.y-me.y)<70){inCar=true;snd(200,.15,'square',.06,400)}
 else toast('العربية بعيدة عنك')}
function nitro(){if(paused||!inCar||nitCd>0)return;nitT=1.2+S.nit*.35;nitCd=5;nz(.5,.15,1500)}
function horn(){hornT=.4;snd(420,.4,'square',.07);snd(520,.4,'square',.07)}
function bind(id,f){$(id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();f()})}
bind('bE',toggleCar);bind('bN',nitro);bind('bH',horn);
$('mt').onclick=()=>{muted=!muted;ens();if(master)master.gain.value=muted?0:1;$('mt').textContent=muted?'تشغيل الصوت':'كتم الصوت'};
// ---------- shop ----------
function shop(){paused=true;jend();const o=$('ov');o.className='';$('oh').textContent='المتجر';$('op').textContent='فلوسك: '+S.money+' جنيه';const ob=$('ob');ob.innerHTML='';
 const items=[['محرك أقوى','eng',5,l=>100*(l+1)],['نيترو أطول','nit',5,l=>80*(l+1)],['إطارات أحسن (دوران أسهل)','tire',5,l=>60*(l+1)]];
 for(const[n,k,mx,c]of items){const b=document.createElement('button'),l=S[k];
  if(l>=mx){b.textContent=n+' (أقصى مستوى)';b.disabled=true}else{b.textContent=n+' - مستوى '+l+' - '+c(l)+' جنيه';b.disabled=S.money<c(l);b.onclick=()=>{S.money-=c(l);S[k]++;save();snd(900,.1,'sine',.1);shop()}}ob.appendChild(b)}
 const cb=document.createElement('button');cb.textContent='غيّر لون العربية - 40 جنيه';cb.disabled=S.money<40;cb.style.background=COLS[(S.col+1)%COLS.length];cb.onclick=()=>{S.money-=40;S.col=(S.col+1)%COLS.length;save();snd(900,.1,'sine',.1);shop()};ob.appendChild(cb);
 const x=document.createElement('button');x.textContent='رجوع للعبة';x.style.background='#334155';x.onclick=()=>{o.className='hide';paused=false;last=performance.now()};ob.appendChild(x)}
$('sh').onclick=()=>{if(started)shop()};
// ---------- update ----------
function update(dt){
 time+=dt;dayT=(dayT+dt)%DAY;shake=Math.max(0,shake-dt);hornT=Math.max(0,hornT-dt);nitT=Math.max(0,nitT-dt);nitCd=Math.max(0,nitCd-dt);
 let ix=vx+((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0),iy=vy+((keys['s']||keys['arrowdown'])?1:0)-((keys['w']||keys['arrowup'])?1:0);
 let mm=Math.hypot(ix,iy);if(mm>1){ix/=mm;iy/=mm;mm=1}
 if(inCar){
  const maxV=240*(1+S.eng*.12)*(nitT>0?1.55:1);
  if(mm>.12){const ta=Math.atan2(iy,ix),df=ad(ta-pc.h),tr=(3+S.tire*.45)*(.45+Math.min(1,Math.abs(pc.v)/70));
   pc.h+=Math.max(-tr*dt,Math.min(tr*dt,df));
   const tv=maxV*(.35+.65*mm)*Math.max(.3,Math.cos(df));pc.v+=Math.max(-300*dt,Math.min((nitT>0?430:230)*dt,tv-pc.v))}
  else pc.v=Math.max(0,pc.v-260*dt);
  const nx=pc.x+Math.cos(pc.h)*pc.v*dt,ny=pc.y+Math.sin(pc.h)*pc.v*dt;let bp=false;
  if(!hit(nx,pc.y,13))pc.x=nx;else bp=true;
  if(!hit(pc.x,ny,13))pc.y=ny;else bp=true;
  if(bp){if(pc.v>90){shake=.2;nz(.12,.2,700)}pc.v*=.55}
 }else{
  if(mm>.12){me.h=Math.atan2(iy,ix);me.w+=dt*10;const nx=me.x+ix*120*dt,ny=me.y+iy*120*dt;if(!hit(nx,me.y,7))me.x=nx;if(!hit(me.x,ny,7))me.y=ny}
 }
 const e=ent();
 // traffic
 for(const c of tcs){
  let tv=c.sp;const dx=Math.cos(c.h),dy=Math.sin(c.h);
  const chk=(ox,oy)=>{const rx=ox-c.x,ry=oy-c.y,al=rx*dx+ry*dy,la=Math.abs(-rx*dy+ry*dx);if(al>0&&al<85&&la<26)tv=0};
  chk(pc.x,pc.y);if(!inCar&&Math.hypot(me.x-c.x,me.y-c.y)<60)chk(me.x,me.y);for(const o of tcs)if(o!==c)chk(o.x,o.y);
  c.v+=Math.max(-260*dt,Math.min(120*dt,tv-c.v));c.x+=dx*c.v*dt;c.y+=dy*c.v*dt;
  const d=Math.hypot(c.x-pc.x,c.y-pc.y);
  if(d<32){const nx=(pc.x-c.x)/(d||1),ny=(pc.y-c.y)/(d||1);if(!hit(pc.x+nx*6,pc.y+ny*6,13)){pc.x+=nx*6;pc.y+=ny*6}if(pc.v>60){shake=.2;nz(.1,.18,900);snd(120,.12,'square',.08,60)}pc.v*=.6}
  if(Math.hypot(c.x-e.x,c.y-e.y)>far()+800)c.dead=1}
 tcs=tcs.filter(c=>!c.dead);
 for(const c of coins){if(Math.hypot(c.x-e.x,c.y-e.y)<24){c.dead=1;S.money+=5;snd(1300,.08,'sine',.07,1700)}else if(Math.hypot(c.x-e.x,c.y-e.y)>far()+800)c.dead=1}
 coins=coins.filter(c=>!c.dead);
 for(const q of peds){
  q.tt-=dt;if(q.tt<=0){q.dir=-q.dir;q.tt=2+Math.random()*5}
  let sp=q.sp;const dc=Math.hypot(q.x-pc.x,q.y-pc.y);
  if(dc<90&&Math.abs(pc.v)>40){const sgn=q.dx?Math.sign(q.x-pc.x):Math.sign(q.y-pc.y);q.dir=sgn||1;sp=75}
  q.x+=q.dx*q.dir*sp*dt;q.y+=q.dy*q.dir*sp*dt;
  if(q.dx){if(q.x<q.bx){q.x=q.bx;q.dir=1}else if(q.x>q.bx+B){q.x=q.bx+B;q.dir=-1}}else{if(q.y<q.by){q.y=q.by;q.dir=1}else if(q.y>q.by+B){q.y=q.by+B;q.dir=-1}}
  if(Math.hypot(q.x-e.x,q.y-e.y)>far()+900)q.dead=1}
 peds=peds.filter(q=>!q.dead);
 if(frame%20===0){spawnT();spawnC();spawnP()}
 missionUpdate(dt);
 saveT+=dt;if(saveT>8){saveT=0;save()}
 if(eg&&ac){const sv=inCar?Math.abs(pc.v):0;eg.gain.value=inCar?.03+.05*Math.min(1,sv/300):0;eo.frequency.value=48+sv*.55+(nitT>0?30:0)}
 // hud
 $('mo').textContent=S.money+' جنيه';
 const dm=Math.round(Math.hypot(m.x-e.x,m.y-e.y)/10);
 $('ms').textContent=(m.st===0?'روح استلم الطلب':'وصّل الطلب')+' - '+dm+' متر - '+Math.max(0,Math.ceil(m.t))+' ث';
 const bE=$('bE');bE.textContent=inCar?'نزول':'ركوب';bE.style.opacity=(inCar||Math.hypot(pc.x-me.x,pc.y-me.y)<70)?1:.45;
 $('bN').style.opacity=(!inCar||nitCd>0)?.4:1;
}
